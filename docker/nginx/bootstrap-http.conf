upstream help_desk_app {
    server web:8000;
}

# HTTP-only Bootstrap Configuration for Initial Let's Encrypt Verification
# Used ONLY during initial certificate issuance before HTTPS certificates exist.
server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # ACME HTTP-01 challenge directory for Certbot webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Static assets
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Reverse proxy to Django application during bootstrap verification
    location / {
        proxy_pass http://help_desk_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
