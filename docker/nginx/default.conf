upstream help_desk_app {
    server web:8000;
}

# 1. HTTP: ACME Challenge (Let's Encrypt HTTP-01) + Redirect to HTTPS
server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # ACME webroot challenge directory for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS: SSL termination for IP / Domain
server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 10M;

    # Let's Encrypt certificate paths (managed via certbot certonly --cert-name helpes-ip)
    ssl_certificate /etc/letsencrypt/live/helpes-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helpes-ip/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Static assets
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Reverse proxy to Django Gunicorn application
    location / {
        proxy_pass http://help_desk_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
